name: Compare PR Changes

on:
  pull_request:
    branches:
      - main

jobs:
  compare-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and checkout master branch snapshot
        run: |
          git fetch origin master
          git worktree add ../master-branch origin/master

      - name: Compare PR files against master
        run: |
          echo "=== Showing file-level differences against master ==="

          changed_files=$(git diff --name-only --diff-filter=ACMR origin/master...HEAD)

          if [[ -z "$changed_files" ]]; then
            echo "No file-level changes found between this PR and master."
            exit 0
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            echo "Comparing $file"

            if [[ -f "../master-branch/$file" && -f "$file" ]]; then
              diff -u "../master-branch/$file" "$file" || true
            elif [[ -f "$file" ]]; then
              echo "$file exists only in the PR branch."
            else
              echo "$file exists only in master."
            fi

            echo
          done <<< "$changed_files"

      - name: Clean up master worktree
        if: always()
        run: git worktree remove ../master-branch --force
